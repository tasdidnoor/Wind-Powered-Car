<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Wind-Powered Car</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="loader"><div class="spinner"></div></div>

    <div class="header">
        <h1>Wind-Powered Car</h1>
    </div>

    <div id="container"></div>

    <div class="controls-container">
        <div class="controls">
            <div class="color-dot active" style="background: #0a0a0a;" onclick="updateColor('#0a0a0a', this)"></div>
            <div class="color-dot" style="background: #e60000;" onclick="updateColor('#e60000', this)"></div>
            <div class="color-dot" style="background: #007aff;" onclick="updateColor('#007aff', this)"></div>
            <div class="color-dot" style="background: #2ecc71;" onclick="updateColor('#2ecc71', this)"></div>
            <div class="color-dot" style="background: #f1c40f;" onclick="updateColor('#f1c40f', this)"></div>
            <div class="color-dot" style="background: #9b59b6;" onclick="updateColor('#9b59b6', this)"></div>
            <div class="color-dot" style="background: #5c5c5c;" onclick="updateColor('#5c5c5c', this)"></div>
            <div class="color-dot" style="background: #ffffff;" onclick="updateColor('#ffffff', this)"></div>
        </div>
    </div>

    <div class="footer">© 2026 TASDID NOOR</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module" src="script.js"></script>
</body>
</html>
