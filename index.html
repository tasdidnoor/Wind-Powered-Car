<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Wind-Powered Car</title>
    <style>
        :root {
            --bg-color: #030303; /* Rich designer black */
            --glass-bg: rgba(20, 20, 20, 0.6);
            --accent-color: #ffffff;
            --text-color: #ffffff;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        #container {
            width: 100vw;
            height: 100vh;
            outline: none;
            cursor: grab;
        }
        #container:active { cursor: grabbing; }

        .header {
            position: absolute;
            top: 60px;
            text-align: center;
            z-index: 10;
            pointer-events: none;
            width: 100%;
        }

        .header h1 {
            font-weight: 500;
            font-size: 28px;
            margin: 0;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #ffffff;
            opacity: 0.9;
        }

        @media (max-width: 768px) {
            .header { top: 40px; }
            .header h1 { font-size: 20px; letter-spacing: 1px; }
        }

        .controls-container {
            position: absolute;
            bottom: 80px;
            width: 100%;
            display: flex;
            justify-content: center;
            pointer-events: none;
        }

        .controls {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 12px 24px;
            border-radius: 40px;
            display: flex;
            gap: 15px;
            align-items: center;
            pointer-events: auto;
            border: 1px solid var(--border-color);
        }

        .color-dot {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1.5px solid transparent;
        }

        .color-dot.active {
            border-color: #ffffff;
            transform: scale(1.2);
        }

        .footer {
            position: absolute;
            bottom: 30px;
            font-size: 10px;
            font-weight: 400;
            opacity: 0.5;
            pointer-events: none;
            text-align: center;
            width: 100%;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #fff;
        }

        #loader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 1s ease;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            border-top: 1px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="loader"><div class="spinner"></div></div>

    <div class="header">
        <h1>Wind-Powered Car</h1>
    </div>

    <div id="container"></div>

    <div class="controls-container">
        <div class="controls">
            <!-- Refined metallic color palette -->
            <div class="color-dot active" style="background: #0a0a0a;" onclick="updateColor('#0a0a0a', this, 0.1, 0.9)"></div>
            <div class="color-dot" style="background: #7a0000;" onclick="updateColor('#7a0000', this, 0.2, 0.8)"></div>
            <div class="color-dot" style="background: #001f5c;" onclick="updateColor('#001f5c', this, 0.2, 0.8)"></div>
            <div class="color-dot" style="background: #00331a;" onclick="updateColor('#00331a', this, 0.2, 0.8)"></div>
            <div class="color-dot" style="background: #5c5c5c;" onclick="updateColor('#5c5c5c', this, 0.1, 1.0)"></div>
            <div class="color-dot" style="background: #e0e0e0;" onclick="updateColor('#e0e0e0', this, 0.1, 0.5)"></div>
        </div>
    </div>

    <div class="footer">Copyright Tasdid noor, 2026</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { STLLoader } from 'three/addons/loaders/STLLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

        let scene, camera, renderer, model, controls;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x030303);

            camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(200, 120, 200);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.0;
            
            document.getElementById('container').appendChild(renderer.domElement);

            // Lighting: Simple and bright for visibility
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.2);
            directionalLight.position.set(50, 100, 50);
            scene.add(directionalLight);

            const backLight = new THREE.DirectionalLight(0xffffff, 0.5);
            backLight.position.set(-50, 50, -50);
            scene.add(backLight);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.4;
            controls.minDistance = 150;
            controls.maxDistance = 450;
            controls.enablePan = false;

            const loader = new STLLoader();
            loader.load('./model.stl', function (geometry) {
                // Matte, non-shiny material
                const material = new THREE.MeshStandardMaterial({ 
                    color: 0x444444, 
                    roughness: 0.9, 
                    metalness: 0.1
                });
                
                model = new THREE.Mesh(geometry, material);
                geometry.computeVertexNormals();
                geometry.computeBoundingBox();
                const center = new THREE.Vector3();
                geometry.boundingBox.getCenter(center);
                model.position.sub(center);
                
                scene.add(model);
                
                document.getElementById('loader').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('loader').style.display = 'none';
                }, 1000);
            });

            window.addEventListener('resize', onWindowResize, false);
            animate();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        window.updateColor = function(colorStr, el) {
            if (!model) return;
            model.material.color.set(colorStr);
            
            document.querySelectorAll('.color-dot').forEach(dot => dot.classList.remove('active'));
            el.classList.add('active');
        }

        init();
    </script>
</body>
</html>
